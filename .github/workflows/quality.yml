name: Quality checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend_react/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run test:parties
      - run: npm run test:chat-stream
      - run: npm run test:image-groups
      - run: npm run test:local-routing

  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_DB_PATH: /tmp/odoc-ci/db.sqlite3
      DJANGO_MEDIA_ROOT: /tmp/odoc-ci/media
      ODOC_SYSTEM_LOG_DIR: /tmp/odoc-ci/logs
      ODOC_CHROMA_PATH: /tmp/odoc-ci/chroma
      ODOC_TOKEN_USAGE_DETAIL_DIR: /tmp/odoc-ci/tokens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system -r requirements.txt
      - run: mkdir -p /tmp/odoc-ci
      - run: python manage.py check
      - name: Test article and isolated synchronization paths
        run: >-
          python manage.py test --noinput
          article.test_agent_post_rating_read
          article.test_article_list_professions
          article.test_image_list_queries
          article.test_image_group_membership
          article.test_image_move
          article.test_image_create_atomic
          article.test_image_not_found
          article.test_html_list_queries
          anthology.test_image_cover_queries
          anthology.test_book_cover_queries
          anthology.test_agent_cover_queries
          anthology.test_article_cover_queries
          anthology.test_quant_cover_queries
          anthology.test_novel_cover_queries
          assets.test_photo_shared_resource
          assets.test_agent_reference_compat
          assets.test_resource_path_safety
          assets.test_resource_deletion
          article.tests.ArticleListSummaryTests
          system_settings.tests.SyncManagerTests.test_manual_upload_empty_destination_then_confirmed_replacement
          system_settings.tests.SyncManagerTests.test_v2_avatar_blob_restores_to_media_root_path_referenced_by_profile

  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: odoc_isolated
          POSTGRES_DB: odoc_isolated
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U odoc_isolated -d odoc_isolated"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://odoc_isolated@127.0.0.1:5432/odoc_isolated
      ODOC_ISOLATED_PG_TEST: '1'
      DJANGO_MEDIA_ROOT: /tmp/odoc-pg-ci/media
      ODOC_SYSTEM_LOG_DIR: /tmp/odoc-pg-ci/logs
      ODOC_CHROMA_PATH: /tmp/odoc-pg-ci/chroma
      ODOC_TOKEN_USAGE_DETAIL_DIR: /tmp/odoc-pg-ci/tokens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv pip install --system -r requirements.txt
      - run: mkdir -p /tmp/odoc-pg-ci
      - name: Test concurrent photos and resource references
        run: >-
          python manage.py test --noinput
          article.test_image_group_concurrency
          article.test_image_group_membership
          article.test_image_move
          article.test_image_create_atomic
          article.test_image_not_found
          anthology.test_image_cover_queries
          anthology.test_book_cover_queries
          anthology.test_agent_cover_queries
          anthology.test_article_cover_queries
          anthology.test_quant_cover_queries
          anthology.test_novel_cover_queries
          novel.tests
          assets.test_agent_reference_compat
          assets.test_photo_shared_resource
