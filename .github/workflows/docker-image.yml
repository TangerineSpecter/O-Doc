name: Build And Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker-ghcr:
    name: Publish GitHub Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  docker-tcr:
    name: Publish Tencent Cloud TCR
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and push Docker image to Tencent Cloud TCR
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          TCR_REGISTRY: ccr.ccs.tencentyun.com
          TCR_IMAGE: ccr.ccs.tencentyun.com/tangerine_specter/o-doc:latest
          TCR_PLATFORM: linux/amd64
        run: |
          # 默认仅推送 latest 到腾讯云 TCR。
          # 如需恢复 Git tag 版本号镜像推送，取消下面三行注释即可。
          # if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
          #   export TCR_EXTRA_TAGS="ccr.ccs.tencentyun.com/tangerine_specter/o-doc:${GITHUB_REF_NAME}"
          # fi

          ./scripts/push-tcr.sh
