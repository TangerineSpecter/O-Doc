name: Build And Publish Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  UPDATER_IMAGE: ghcr.io/tangerinespecter/o-doc-updater:v1

jobs:
  docker-ghcr:
    name: Publish GitHub Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ODOC_BUILD_VERSION=${{ github.ref_name }}
            ODOC_BUILD_COMMIT=${{ github.sha }}

      - name: Build and push updater image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.updater
          push: true
          tags: ${{ env.UPDATER_IMAGE }}

  docker-tcr:
    name: Publish Tencent Cloud TCR
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and push Docker image to Tencent Cloud TCR
        env:
          TCR_USERNAME: ${{ secrets.TCR_USERNAME }}
          TCR_PASSWORD: ${{ secrets.TCR_PASSWORD }}
          TCR_REGISTRY: ccr.ccs.tencentyun.com
          TCR_IMAGE: ccr.ccs.tencentyun.com/tangerine_specter/o-doc:latest
          TCR_UPDATER_IMAGE: ccr.ccs.tencentyun.com/tangerine_specter/o-doc-updater:v1
          TCR_PLATFORM: linux/amd64
          TCR_BUILD_VERSION: ${{ github.ref_name }}
          TCR_BUILD_COMMIT: ${{ github.sha }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            export TCR_EXTRA_TAGS="ccr.ccs.tencentyun.com/tangerine_specter/o-doc:${GITHUB_REF_NAME}"
          fi

          ./scripts/push-tcr.sh
