services:
  db:
    image: ${POSTGRES_IMAGE:-m.daocloud.io/docker.io/postgres:16-alpine}
    container_name: ${POSTGRES_CONTAINER_NAME:-o-doc-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-odoc}
      POSTGRES_USER: ${POSTGRES_USER:-odoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_HOST_PORT:-15432}:5432"
    volumes:
      - ./deploy/runtime/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${IMAGE_NAME:-ghcr.io/tangerinespecter/o-doc:latest}
    container_name: ${CONTAINER_NAME:-o-doc}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-11800}:11800"
    environment:
      PORT: 11800
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-*}"
      DJANGO_DB_ENGINE: postgresql
      POSTGRES_DB: ${POSTGRES_DB:-odoc}
      POSTGRES_USER: ${POSTGRES_USER:-odoc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_MEDIA_ROOT: /app/runtime/media
      DJANGO_STATIC_ROOT: /app/staticfiles
      ODOC_CHROMA_PATH: /app/runtime/chroma_data
      ODOC_AUTO_UPDATE: "true"
      ODOC_UPDATE_DIR: /app/runtime/update
    volumes:
      - ./deploy/runtime/media:/app/runtime/media
      - ./deploy/runtime/chroma_data:/app/runtime/chroma_data
      - ./deploy/runtime/update:/app/runtime/update

  updater:
    image: ${UPDATER_IMAGE:-ghcr.io/tangerinespecter/o-doc-updater:v1}
    container_name: ${UPDATER_CONTAINER_NAME:-o-doc-updater}
    restart: unless-stopped
    environment:
      ODOC_DEPLOY_DIR: "${PWD}"
      ODOC_UPDATE_DIR: /var/lib/odoc-update
      ODOC_UPDATE_HEALTH_URL: http://app:11800/api/health/
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - "${PWD}:${PWD}:ro"
      - "${HOME}/.docker:/root/.docker:ro"
      - ./deploy/runtime/update:/var/lib/odoc-update
    working_dir: "${PWD}"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
