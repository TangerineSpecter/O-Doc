<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿尼亚 · 骨骼动画实验室</title><link rel="icon" href="data:,"><link rel="stylesheet" href="anya-rig/studio.css"><script defer src="anya-rig/atlas.js"></script><script defer src="anya-rig/motion.js"></script><script defer src="anya-rig/character-art.js"></script><script defer src="anya-rig/renderer.js"></script><script defer src="anya-rig/studio.js"></script></head>
<body><main><header><div><small>O-Doc / 角色动作研究 · 01</small><h1>阿尼亚的冒险练习</h1></div><span class="edition">骨骼动画 · 第三版 · 重建姿态</span></header><div class="workspace"><section class="viewer"><div class="viewerbar"><b id="actionName">待机</b><span id="status" role="status">正在加载拆件素材…</span></div><div class="stage"><canvas id="stage" width="1000" height="800" aria-label="阿尼亚骨骼动画预览"></canvas><img id="reference" src="anya-rig/reference.png" alt="用户提供的阿尼亚原始参考图" hidden><span class="stage-note">ANYA / ADVENTURER</span></div><div class="transport"><button id="play" disabled>暂停</button><input id="timeline" aria-label="动画进度" type="range" min="0" max="1000" value="0"><output id="time">0.00 / 3.20 s</output></div><div id="pose-strip" hidden></div></section><aside><h2>动作库</h2><div id="actions"></div><div class="options"><h2>检查视图</h2><label><input id="bones" type="checkbox"> 显示骨架与关节</label><label><input id="spread" type="checkbox"> 拆件展开</label><label><input id="keyframes" type="checkbox"> 检查关键姿态</label><label><input id="original" type="checkbox"> 对照原始参考图</label><label><input id="loop" type="checkbox" checked> 循环播放</label><label><input id="effects" type="checkbox" checked> 显示动作特效</label><div class="speed"><span>速度</span><button data-speed="0.5">0.5×</button><button data-speed="1" aria-pressed="true">1×</button><button data-speed="1.5">1.5×</button></div><button id="flip">水平翻转</button></div><p class="description" id="description"></p><p class="scope">形象按侧向动作需求重新设计，参考图仅提供身份特征。本页验证固定骨架与动作，不包含自动拆图、装备换装或战斗结算。</p></aside></div><footer><span>完整姿态定标 · 连续肢体轮廓 · 独立脚掌与手型</span><span>快捷键 1–5 切换动作 / 空格暂停</span></footer></main></body></html>
